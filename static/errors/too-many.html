<!DOCTYPE html>
<!-- Shown by Nginx for 429 (rate limit): a visitor or bot sent too many requests in a short time. Plain HTML, no scripts, no contact details. -->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Please Slow Down | Desi Roots</title>
<style>
  :root { --sp-bg:#FCFBF8; --sp-text:#2F2F2F; --sp-muted:#5a4e44; --sp-cta:#B35A12; --sp-cta-dark:#9C4D10; --sp-gold:#8F5E14; --sp-border:#E8E2D8; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--sp-bg); color:var(--sp-text);
         font-family:-apple-system, 'Segoe UI', Roboto, Arial, sans-serif; padding:24px 16px; text-align:center; }
  main { max-width:460px; }
  img { width:66px; height:80px; }
  .tag { margin:18px 0 6px; font-size:.78rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--sp-gold); }
  h1 { margin:0 0 12px; font-size:1.6rem; line-height:1.25; }
  p { margin:0 0 22px; color:var(--sp-muted); line-height:1.6; }
  a.btn { display:inline-block; padding:12px 22px; border-radius:8px; background:var(--sp-cta); color:#fff; font-weight:600; text-decoration:none; }
  a.btn:hover, a.btn:focus-visible { background:var(--sp-cta-dark); }
  a.btn:focus-visible { outline:3px solid #1a5fb4; outline-offset:3px; }
</style>
</head>
<body>
<main>
  <img src="/static/images/logo-160.webp" alt="Desi Roots" width="66" height="80">
  <p class="tag">Too many requests</p>
  <h1>Please wait a minute</h1>
  <p>We received a lot of requests from your connection in a short time. Wait about a minute, then carry on browsing.</p>
  <a class="btn" href="/">Back to the home page</a>
</main>
</body>
</html>
